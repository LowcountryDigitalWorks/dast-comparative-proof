name: Validate synthetic DAST proof

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install exact direct dependencies
        run: npm install --no-fund --no-audit

      - name: Publish generated lockfile once
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'phase-b/one-shot-benchmark' && github.event.pull_request.head.repo.full_name == github.repository }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json is already tracked; no publication needed."
            exit 0
          fi
          lock_b64="$(base64 -w0 package-lock.json)"
          jq -n \
            --arg message "Phase B: freeze npm dependency lockfile" \
            --arg content "$lock_b64" \
            --arg branch "$GITHUB_HEAD_REF" \
            '{message:$message,content:$content,branch:$branch}' \
            | gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/package-lock.json" --input - >/dev/null
          echo "Published generated package-lock.json to the proof branch."

      - name: Show formatter diff when the candidate is not clean
        shell: bash
        run: |
          set -euo pipefail
          npm run format
          if ! git diff --quiet; then
            echo "Formatter changed tracked files; commit the exact formatting below." >&2
            git diff --no-ext-diff
            exit 1
          fi

      - name: Validate proof implementation
        run: npm run validate
